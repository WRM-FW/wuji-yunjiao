<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>登录 / 注册 - 吴记云饺</title>
  <meta name="description" content="吴记云饺订餐账号：手机号或邮箱加密码即可注册登录，无需短信与邮件验证。" />
  <meta name="theme-color" content="#C92A2A" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="mask-icon" href="favicon.svg" color="#C92A2A" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .auth-wrap {
      max-width: 460px;
      margin: 0 auto;
      padding: 18px 16px calc(28px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .auth-hero {
      background: linear-gradient(135deg, #A61E1E 0%, #C92A2A 60%, #D94848 100%);
      color: #fff;
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-md);
    }
    .auth-hero h1 { font-size: 19px; font-weight: 800; letter-spacing: .5px; }
    .auth-hero p { font-size: 12px; margin-top: 4px; opacity: .92; line-height: 1.5; }
    .auth-card {
      background: #fff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .auth-tab {
      padding: 10px;
      text-align: center;
      border-radius: 10px;
      border: 1.5px solid var(--border-color);
      background: #F8FAFC;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }
    .auth-tab.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }
    .auth-field { margin-bottom: 12px; }
    .auth-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .auth-field .hint { font-weight: 400; color: var(--text-light); margin-left: 4px; }
    .auth-input {
      width: 100%;
      padding: 11px 12px;
      font-size: 15px;
      font-family: inherit;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      background: #F8FAFC;
      outline: none;
    }
    .auth-input:focus { border-color: var(--primary); background: #fff; }
    .auth-error {
      display: none;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #B91C1C;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12.5px;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .auth-error.show { display: block; }
    .auth-note {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.6;
      background: #F8FAFC;
      border-radius: 8px;
      padding: 9px 11px;
    }
    .auth-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 12.5px;
    }
    .auth-links a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .auth-who {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      color: #065F46;
    }
    .auth-who.show { display: flex; }
    @media (min-width: 761px) {
      .auth-wrap { padding-top: 32px; }
      .auth-card { padding: 22px; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <main class="auth-wrap">
      <div class="auth-hero">
        <h1>吴记云饺 · 订餐账号</h1>
        <p>📍 河南信息科技学院三楼 · 营业 10:30-20:30</p>
        <p>手机号或邮箱 + 密码即可注册登录，不收短信验证码，注册后直接进店里点餐。</p>
      </div>

      <div class="auth-who" id="loggedInBox">
        <span id="loggedInText">已登录</span>
        <button class="btn-secondary" id="logoutBtn" style="width:auto;padding:6px 12px;font-size:12px;">退出登录</button>
      </div>

      <div class="auth-card">
        <div class="auth-tabs">
          <div class="auth-tab active" id="tabRegister">新用户注册</div>
          <div class="auth-tab" id="tabLogin">已有账号登录</div>
        </div>

        <div class="auth-error" id="authError"></div>

        <div class="auth-field" id="nicknameField">
          <label for="nicknameInput">昵称 <span class="hint">商家出餐时叫你用的名字</span></label>
          <input class="auth-input" id="nicknameInput" type="text" maxlength="20" placeholder="例如：小明 / 3号楼小李" autocomplete="nickname" />
        </div>

        <div class="auth-field">
          <label for="identifierInput">手机号或邮箱</label>
          <input class="auth-input" id="identifierInput" type="text" inputmode="email" maxlength="60" placeholder="13800001234 或 you@example.com" autocomplete="username" />
        </div>

        <div class="auth-field">
          <label for="passwordInput">密码 <span class="hint">至少 6 位</span></label>
          <input class="auth-input" id="passwordInput" type="password" maxlength="64" placeholder="设置一个只有你知道的密码" autocomplete="current-password" />
        </div>

        <button class="btn-primary" id="submitAuthBtn">注册并开始点餐</button>

        <div class="auth-links">
          <a href="index.html">先随便看看菜单 →</a>
          <span id="modeHint" style="color:var(--text-light);">已有账号？点上方「已有账号登录」</span>
        </div>
      </div>

      <div class="auth-note">
        说明：手机号登录在后台会映射成一个内部账号标识，不会给任何手机号发送短信；
        你的身份（普通用户 / 商家 / 管理员）由服务器保存，改前端代码无法提权。
      </div>
    </main>

    <div id="toast" class="toast-container"></div>
  </div>

  <script src="js/vendor/supabase-2.117.3.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
